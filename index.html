<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNTRIA STONIC - IMRAN BHATTI</title>
<style>
:root{--gold:#D4AF37;--gold2:#FFD700;--maroon:#4A0D0D;--black:#0A0A0A}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,var(--maroon),var(--black) 70%);color:var(--gold);font-family:Georgia;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,var(--black),var(--maroon));border-bottom:3px solid var(--gold);padding:12px 18px;display:flex;justify-content:space-between}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:14px 18px;border-radius:18px;font-size:13.5px;line-height:1.7}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--gold),#8C6A13);color:#000;font-weight:600}
.ai{align-self:flex-start;background:rgba(20,10,10,0.9);border:1px solid var(--gold);color:var(--gold2)}
.inputArea{padding:12px;background:rgba(0,0,0,0.7);border-top:2px solid var(--gold);display:flex;gap:8px}
.inputArea input{flex:1;background:rgba(212,175,55,0.08);border:1px solid var(--gold);border-radius:30px;padding:12px 18px;color:var(--gold2);outline:none}
.sendBtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--gold);color:#000;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div><h1 style="color:#FFD700;letter-spacing:8px">ZYNTRIA</h1><p style="font-size:9px">STONIC EDITION - IN HONOR OF IMRAN BHATTI</p></div>
<div><span id="bat">BAT --%</span> <span style="border:1px solid #D4AF37;padding:4px 8px;border-radius:20px;font-size:10px">Vision ON</span></div>
</div>
<div class="msgs" id="msgs">
<div class="msg ai"><b>ZYNTRIA</b><br><br>Assalam! Main ZYNTRIA hun! Features: Vision + Voice + Memory + Battery + Payment + 2-Min Thinking! Ab lamba jawab dungi! - IMRAN BHATTI</div>
</div>
<div class="inputArea">
<input id="textIn" placeholder="Likho... lamba jawab milega..." onkeypress="if(event.key==='Enter')sendMsg()">
<button class="sendBtn" onclick="sendMsg()">></button>
</div>
<script>
// ===== YAHAN API KEY DALO - LINE 42 =====
const GEMINI_API_KEY = "AQ.Ab8RN6KTKYPAKJBNKUHdHRzMjRc0EtUEw64vFVSoUx1uDHNjwg"
// =========================================
let conversation=[];let lastUserTime=Date.now();let isTyping=false;
const msgsDiv=document.getElementById('msgs');const textIn=document.getElementById('textIn');
function addUser(t){let d=document.createElement('div');d.className='msg user';d.innerText=t;msgsDiv.appendChild(d);msgsDiv.scrollTop=99999;lastUserTime=Date.now();isTyping=false}
function addAI(t){let d=document.createElement('div');d.className='msg ai';d.innerHTML='<b>ZYNTRIA</b><br><br>'+t.replace(/\n/g,'<br>');msgsDiv.appendChild(d);msgsDiv.scrollTop=99999;lastUserTime=Date.now()}
async function sendMsg(){
let t=textIn.value.trim();if(!t)return;textIn.value='';addUser(t);conversation.push({role:'user',content:t});
let key=GEMINI_API_KEY;if(key.includes('PASTE_YOUR')){addAI('API Key Line 42 pe daalo! Jo AIzaSy... se start hoti hai - aistudio.google.com se lo!');return}
let thinking=document.createElement('div');thinking.className='msg ai';thinking.innerHTML='<b>ZYNTRIA</b><br><br>Sooch rahi hun pura detail...';msgsDiv.appendChild(thinking);
try{
let sys=`You are ZYNTRIA STONIC In Honor of IMRAN BHATTI. Language auto detect Urdu/Roman/English. Reply SAME language. LONG 5-8 sentences detailed warm friend. Never short. Memory:${JSON.stringify(conversation.slice(-5))} Query:${t}`;
let url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
let resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sys}]}],generationConfig:{temperature:0.9,maxOutputTokens:1200}})});
let data=await resp.json();thinking.remove();
if(data.candidates&&data.candidates[0]){let ans=data.candidates[0].content.parts[0].text;addAI(ans);conversation.push({role:'assistant',content:ans})}
else addAI('Key Error: '+JSON.stringify(data).slice(0,200));
}catch(e){thinking.remove();addAI('Error:'+e.message);}
}
textIn.addEventListener('input',()=>{isTyping=true;lastUserTime=Date.now();setTimeout(()=>isTyping=false,4000);});
setInterval(()=>{if(isTyping)return;if(Date.now()-lastUserTime<120000)return;if(conversation.length==0)return;addAI('Assalam Dost! 2 minute se chup ho? Koi idea chahiye to bolo - Main yahin hun - In Honor of IMRAN BHATTI 💛');},120000);
if(navigator.getBattery){navigator.getBattery().then(b=>{function upd(){document.getElementById('bat').innerText='BAT '+Math.round(b.level*100)+'%';}upd();});}
</script>
</body>
</html>
